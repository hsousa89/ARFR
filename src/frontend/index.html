    <script>
        console.log("--- A INICIAR A APLICAÇÃO ---");
        window.APP_DATA = <?!= initialData ?>;
        console.log("1. Dados recebidos:", window.APP_DATA ? "SIM" : "NÃO", window.APP_DATA);

        window.addEventListener('DOMContentLoaded', () => {
            console.log("2. Estrutura HTML (DOM) carregada.");

            if (typeof window.handleRouting !== 'function') {
                console.error("ERRO CRÍTICO: router.html não carregou!");
                return;
            }

            if (window.google && google.script && google.script.url) {
                console.log("3. A pedir o URL ao servidor da Google...");
                google.script.url.getLocation((location) => {
                    console.log("4. URL recebido:", location);

                    // Start with the base hash
                    let fullRoute = location.hash || 'dashboard';

                    // THE FIX: If Google caught an ID parameter, glue it back on!
                    if (location.parameter && location.parameter.id) {
                        fullRoute += '?id=' + location.parameter.id;
                    }

                    console.log("5. A encaminhar para:", fullRoute);
                    window.handleRouting(fullRoute);
                });
            } else {
                console.log("3. Modo Local Detetado. A encaminhar para:", window.location.hash);
                window.handleRouting(window.location.hash);
            }
        });
    </script>
