<script>
    window.advanceToSort = () => {
        const match = window.currentActiveMatch;
        if (match.participants.length < 14) return alert("Precisa de pelo menos 14 jogadores para ordenar.");
        if (!confirm('Deseja fechar a convocatória e calcular a ordem de entrada (prioridades, etc)?')) return;

        const allPlayers = window.APP_DATA.players || [];
        const matchesHistory = window.APP_DATA.matches || [];

        const fullParticipants = match.participants.map(p => {
            const dbPlayer = allPlayers.find(pl => pl.id === p.playerId) || { entersDraft: true, isShiftWorker: false, positions: [p.position || 'MED'] };
            return { ...p, ...dbPlayer };
        });

        const sortedHistory = [...matchesHistory].sort((a, b) => new Date(b.date) - new Date(a.date));
        const pastMatches = sortedHistory.filter(m => m.id !== match.id && m.status !== 'PRE-DRAFT');
        const lastPlayedMatch = pastMatches.length > 0 ? pastMatches[0] : null;

        fullParticipants.forEach(player => {
            player.hasPriority = false;
            if (player.entersDraft === false) return;

            let matchToEvaluate = null;
            if (player.isShiftWorker) {
                matchToEvaluate = pastMatches.find(m => m.participants.some(p => p.playerId === player.id && p.isAttending));
            } else if (lastPlayedMatch) {
                const attendedLast = lastPlayedMatch.participants.some(p => p.playerId === player.id && p.isAttending);
                if (attendedLast) matchToEvaluate = lastPlayedMatch;
            }

            if (matchToEvaluate) {
                const pRecord = matchToEvaluate.participants.find(p => p.playerId === player.id);
                if (pRecord && (pRecord.earnedPriority === true || pRecord.firstTeam === false)) {
                    player.hasPriority = true;
                }
            }
        });

        const priorityPlayers = fullParticipants.filter(p => p.hasPriority);
        const remainingPlayers = fullParticipants.filter(p => !p.hasPriority);
        const pureGRs = remainingPlayers.filter(p => p.entersDraft === true && p.positions && p.positions.length === 1 && p.positions[0] === 'GR');

        let regularDraftPool = remainingPlayers.filter(p => p.entersDraft === true && !(p.positions && p.positions.length === 1 && p.positions[0] === 'GR'));

        for (let i = regularDraftPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [regularDraftPool[i], regularDraftPool[j]] = [regularDraftPool[j], regularDraftPool[i]];
        }

        const nonDrafters = remainingPlayers.filter(p => p.entersDraft === false);
        const finalSorted = [...priorityPlayers, ...pureGRs, ...regularDraftPool, ...nonDrafters];
        const CAPACITY = 18;

        match.participants = finalSorted.map((p, index) => {
            const isFirstTeam = index < CAPACITY;
            return {
                playerId: p.playerId || p.id,
                isAttending: true,
                arrivalTime: p.arrivalTime || null,
                firstTeam: isFirstTeam,
                team: null,
                position: p.position || (p.positions ? p.positions[0] : 'MED'),
                draft: null,
                earnedPriority: !isFirstTeam
            };
        });

        match.status = 'SORT';
        window.renderMatchBoardState();
        google.script.run.apiSaveMatch(match);
    };

    window.renderSortView = () => {
        const match = window.currentActiveMatch;
        const allPlayers = window.APP_DATA.players || [];
        const container = document.getElementById('list-sorted-players');
        if (!container) return;

        let html = '';
        const CAPACITY = 18;

        match.participants.forEach((p, index) => {
            const playerDb = allPlayers.find(pl => pl.id === p.playerId) || { name: 'Desconhecido' };
            const isWaitlisted = index >= CAPACITY;

            if (index === CAPACITY) {
                html += `
                    <div class="flex items-center gap-4 my-2">
                        <div class="flex-1 border-t-2 border-dashed border-red-500/50"></div>
                        <span class="text-red-500 text-[10px] font-bold uppercase tracking-widest bg-surface px-2">Linha de Corte (Lista de Espera)</span>
                        <div class="flex-1 border-t-2 border-dashed border-red-500/50"></div>
                    </div>
                `;
            }

            const badge = isWaitlisted
                ? '<span class="text-[9px] bg-red-500/20 text-red-500 px-2 py-1 rounded border border-red-500/30 uppercase tracking-widest">+ Prioridade Ganha</span>'
                : '<span class="text-[9px] bg-green-500/20 text-green-500 px-2 py-1 rounded border border-green-500/30 uppercase tracking-widest">Plantel Principal</span>';

            html += `
                <div class="flex items-center justify-between bg-background-dark border ${isWaitlisted ? 'border-red-900/30' : 'border-slate-800'} p-3 rounded">
                    <div class="flex items-center gap-4">
                        <span class="text-slate-500 font-mono text-xs w-4 text-right">${index + 1}.</span>
                        <span class="text-white font-bold text-sm">${playerDb.name}</span>
                    </div>
                    ${badge}
                </div>
            `;
        });
        container.innerHTML = html;
    };
</script>
