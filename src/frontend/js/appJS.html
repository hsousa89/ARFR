<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Fetch the real data injected from the backend
    const db = window.APP_DATA;
    const matches = db.matches || [];
    const players = db.players || [];

    // ==========================================
    // GLOBAL STATS
    // ==========================================
    const totalMatches = matches.length;
    let totalGoals = 0;

    matches.forEach(match => {
      const goalsA = match.score?.teamA || 0;
      const goalsB = match.score?.teamB || 0;
      totalGoals += (goalsA + goalsB);
    });

    const activePlayers = players.filter(p => !p.removedAt).length;
    const avgGoals = totalMatches > 0 ? (totalGoals / totalMatches).toFixed(1) : 0;

    // Inject the real numbers into the HTML
    document.getElementById('stat-matches').innerText = totalMatches;
    document.getElementById('stat-goals').innerText = totalGoals;
    document.getElementById('stat-players').innerText = activePlayers;
    document.getElementById('stat-avg').innerText = avgGoals;

    // ==========================================
    // GOLDEN BOOT
    // ==========================================

    // Create a quick lookup dictionary so we can map a Player ID to their Name
    const playerMap = {};
    players.forEach(p => {
      playerMap[p.id] = p.name;
    });

    // Tally up the goals for each player ID
    const goalTallies = {};

    matches.forEach(match => {
      // Strategy A: If goals are saved on the participant object
      if (match.participants) {
        match.participants.forEach(p => {
          const pGoals = p.goals || 0;
          if (pGoals > 0) {
            goalTallies[p.playerId] = (goalTallies[p.playerId] || 0) + pGoals;
          }
        });
      }

      // Strategy B: If goals are saved in the events array
      if (match.events) {
        match.events.forEach(event => {
          if (event.type === 'GOAL' && event.playerId) {
            goalTallies[event.playerId] = (goalTallies[event.playerId] || 0) + 1;
          }
        });
      }
    });

    // Convert the dictionary into an array, sort it, and grab the Top 5
    const goldenBootStandings = Object.keys(goalTallies)
      .map(playerId => ({
        name: playerMap[playerId] || 'Jogador Desconhecido',
        goals: goalTallies[playerId]
      }))
      .sort((a, b) => b.goals - a.goals) // Sort descending
      .slice(0, 5); // Take only top 5

    // Render the Table into the DOM
    const goldenBootContainer = document.getElementById('golden-boot-container');

    if (goldenBootStandings.length === 0) {
      goldenBootContainer.innerHTML = '<div class="p-5 text-slate-400 text-sm">Ainda sem golos registados.</div>';
    } else {
      let tableHTML = `
            <table class="w-full text-left">
                <thead class="bg-background-dark border-b border-primary/50 text-slate-500 text-xs uppercase tracking-wider">
                    <tr>
                        <th class="py-3 px-5 font-bold w-12 text-center">#</th>
                        <th class="py-3 px-5 font-bold">Jogador</th>
                        <th class="py-3 px-5 font-bold text-right">Golos</th>
                    </tr>
                </thead>
                <tbody class="text-sm font-bold uppercase">
        `;

      // Generate a row for each player in the Top 5
      goldenBootStandings.forEach((player, index) => {
        const isFirst = index === 0;
        const bgClass = index % 2 === 0 ? 'bg-surface' : 'bg-[#111111]';

        // The 1st place player gets the golden highlight based on your mockup
        const rankColor = isFirst ? 'text-primary' : 'text-slate-500';
        const nameColor = isFirst ? 'text-white' : 'text-slate-300';
        const goalsColor = isFirst ? 'text-primary' : 'text-white';

        tableHTML += `
                <tr class="border-b border-slate-800 ${bgClass} hover:bg-white/5 transition-colors">
                    <td class="py-3 px-5 text-center ${rankColor} font-display text-xl">${index + 1}</td>
                    <td class="py-3 px-5 ${nameColor}">${player.name}</td>
                    <td class="py-3 px-5 text-right font-display text-2xl ${goalsColor}">${player.goals}</td>
                </tr>
            `;
      });

      tableHTML += `
                </tbody>
            </table>
            <div class="p-4 mt-auto border-t border-slate-800">
                <button class="w-full py-2 border border-slate-700 text-slate-300 uppercase font-bold text-xs tracking-wider hover:border-primary hover:text-primary transition-colors">
                    Estatísticas Completas
                </button>
            </div>
        `;

      // Remove the default padding so the table touches the edges perfectly, then inject
      goldenBootContainer.className = "p-0";
      goldenBootContainer.innerHTML = tableHTML;
    }

    // ==========================================
    // ROSTER RENDERING (Plantel)
    // ==========================================
    const rosterGrid = document.getElementById('roster-grid');

    // Sort players alphabetically by default
    const sortedPlayers = [...players].sort((a, b) => a.name.localeCompare(b.name));

    let rosterHTML = '';

    sortedPlayers.forEach(player => {
      // Handle inactive players visually
      const isActive = !player.removedAt;
      const opacityClass = isActive ? 'opacity-100' : 'opacity-50 grayscale';
      const statusBadge = isActive
        ? '<span class="bg-green-900/40 text-green-500 border border-green-900 px-2 py-0.5 text-[10px] font-bold uppercase tracking-widest">Ativo</span>'
        : '<span class="bg-red-900/40 text-red-500 border border-red-900 px-2 py-0.5 text-[10px] font-bold uppercase tracking-widest">Inativo</span>';

      rosterHTML += `
            <div class="bg-surface border border-slate-800 p-6 relative overflow-hidden group hover:border-primary/50 transition-all ${opacityClass}">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-primary/5 rounded-full blur-2xl group-hover:bg-primary/10 transition-all pointer-events-none"></div>
                
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 bg-background-dark border border-slate-700 flex items-center justify-center text-primary font-display text-2xl">
                        ${player.name.charAt(0)}
                    </div>
                    ${statusBadge}
                </div>
                
                <h3 class="text-2xl font-display text-white uppercase tracking-wider truncate" title="${player.name}">
                    ${player.name}
                </h3>
                
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-primary font-bold text-sm tracking-widest border border-primary/30 px-2 py-1 bg-primary/10">
                        ${player.positions && player.positions.length > 0 ? player.positions.join(', ') : 'ND'}
                    </span>
                    <span class="text-slate-500 text-xs uppercase font-bold tracking-wider">
                        ★ ${player.rating || 'N/A'}
                    </span>
                </div>
            </div>
        `;
    });

    rosterGrid.innerHTML = rosterHTML;


    // ==========================================
    // NAVIGATION ROUTING (Navegação SPA)
    // ==========================================
    // We target the hrefs from your sidebar links
    const navLinks = document.querySelectorAll('nav a');
    const views = document.querySelectorAll('.app-view');

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();

        // Get the target view ID from the href (e.g., #dashboard -> view-dashboard)
        const targetHash = link.getAttribute('href').replace('#', '');
        const targetViewId = `view-${targetHash}`;

        // Hide all views
        views.forEach(v => {
          v.classList.remove('block');
          v.classList.add('hidden');
        });

        // Show target view
        const targetView = document.getElementById(targetViewId);
        if (targetView) {
          targetView.classList.remove('hidden');
          targetView.classList.add('block');
        }

        // Update active state on sidebar links
        navLinks.forEach(nav => {
          nav.classList.remove('bg-primary', 'text-background-dark', 'shadow-hard');
          nav.classList.add('text-slate-400');

          // Keep the icon colors right
          const icon = nav.querySelector('.material-symbols-outlined');
          if (icon) icon.style.fontVariationSettings = "'FILL' 0";
        });

        // Highlight the clicked link
        link.classList.add('bg-primary', 'text-background-dark', 'shadow-hard');
        link.classList.remove('text-slate-400');
        const activeIcon = link.querySelector('.material-symbols-outlined');
        if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
      });
    });
  });
</script>
