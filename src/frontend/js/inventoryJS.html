<script>
    document.addEventListener('DOMContentLoaded', () => {
        const db = window.APP_DATA;
        if (!db) return;

        // Pull real data, default to empty array
        const inventory = db.inventory || [];
        const listContainer = document.getElementById('inventory-list');

        if (!listContainer) return;

        // --- Format Currency Helper ---
        const formatEur = (value) => {
            return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(value);
        };

        // --- Calculate Stats ---
        let totalItems = 0;
        let totalValue = 0;
        let warningCount = 0;

        inventory.forEach(item => {
            const qty = parseInt(item.quantity) || 0;
            const val = parseFloat(item.unitValue) || 0; // Assuming we add a unitValue column

            totalItems += qty;
            totalValue += (qty * val);

            // Flag items in bad condition
            if (item.condition && (item.condition.toUpperCase() === 'MAU' || item.condition.toUpperCase() === 'DESGASTADO')) {
                warningCount++;
            }
        });

        // Update UI Stats
        document.getElementById('inv-total-items').innerText = totalItems;
        document.getElementById('inv-total-value').innerText = formatEur(totalValue);
        document.getElementById('inv-warnings').innerText = warningCount;

        // --- Render List ---
        if (inventory.length === 0) {
            listContainer.innerHTML = `
            <tr>
                <td colspan="5" class="py-8 text-center text-slate-500 font-body">
                    O inventário está vazio. Comece a adicionar material.
                </td>
            </tr>`;
            return;
        }

        // Sort alphabetically by name
        const sorted = [...inventory].sort((a, b) => (a.itemName || '').localeCompare(b.itemName || ''));
        let html = '';

        sorted.forEach(item => {
            const qty = parseInt(item.quantity) || 0;
            const val = parseFloat(item.unitValue) || 0;
            const condition = item.condition || 'N/A';

            // Condition Badge Styling
            let conditionClass = 'bg-slate-800 text-slate-400';
            if (condition.toUpperCase() === 'NOVO' || condition.toUpperCase() === 'BOM') {
                conditionClass = 'bg-green-500/10 text-green-500 border border-green-500/20';
            } else if (condition.toUpperCase() === 'MAU' || condition.toUpperCase() === 'DESGASTADO') {
                conditionClass = 'bg-red-500/10 text-red-500 border border-red-500/20';
            }

            html += `
            <tr class="border-b border-slate-800/50 hover:bg-white/5 transition-colors group">
                <td class="py-4 px-6">
                    <p class="text-white font-body font-bold">${item.itemName || 'Sem Nome'}</p>
                    <p class="text-slate-500 text-xs uppercase tracking-widest">${item.category || 'Geral'}</p>
                </td>
                <td class="py-4 px-6 text-center">
                    <span class="font-display text-2xl text-white">${qty}</span>
                </td>
                <td class="py-4 px-6 text-center">
                    <span class="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full ${conditionClass}">
                        ${condition}
                    </span>
                </td>
                <td class="py-4 px-6 text-right">
                    <span class="text-slate-300 font-body">${formatEur(val)}</span>
                </td>
                <td class="py-4 px-6 text-center">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex justify-center gap-2">
                        <button class="text-slate-500 hover:text-white transition-colors" title="Editar">
                            <span class="material-symbols-outlined text-lg">edit</span>
                        </button>
                    </div>
                </td>
            </tr>
        `;
        });

        listContainer.innerHTML = html;
    });
    // ==========================================
    // INVENTORY FRONTEND CONTROLLER (Optimistic UI)
    // ==========================================

    window.handleSaveInventory = (e) => {
        e.preventDefault();

        // 1. Build the object instantly from the form inputs
        const rawId = document.getElementById('inv-id').value;
        const isNew = !rawId;
        const itemId = rawId || 'inv_' + Date.now(); // Generate ID if new

        const itemData = {
            id: itemId,
            itemName: document.getElementById('inv-name').value,
            category: document.getElementById('inv-category').value,
            quantity: parseInt(document.getElementById('inv-qty').value) || 0,
            unitValue: parseFloat(document.getElementById('inv-value').value) || 0,
            condition: document.getElementById('inv-condition').value,
            lastUpdated: new Date().toISOString()
        };

        // 2. CREATE A BACKUP (In case the backend fails)
        const backupInventory = JSON.parse(JSON.stringify(window.APP_DATA.inventory));

        // 3. OPTIMISTIC UPDATE: Modify the local state immediately
        if (isNew) {
            window.APP_DATA.inventory.push(itemData);
        } else {
            const index = window.APP_DATA.inventory.findIndex(i => i.id === itemId);
            if (index > -1) window.APP_DATA.inventory[index] = itemData;
        }

        // 4. INSTANT UI FEEDBACK: Close modal and re-render the view!
        closeInventoryModal();
        // Simulating a click on the sidebar instantly redraws the table with the new data
        document.querySelector('a[href="#inventory"]').click();

        // 5. ASYNC BACKGROUND SAVE: Send it to Google Sheets silently
        google.script.run
            .withSuccessHandler(() => {
                // Success! We don't need to do anything to the UI because we already updated it.
                console.log(`✅ Item ${itemId} saved silently in the background.`);
            })
            .withFailureHandler((error) => {
                // BACKEND FAILED: Rollback the UI to the backup and alert the user
                console.error('Background save failed:', error);
                window.APP_DATA.inventory = backupInventory; // Restore old data
                document.querySelector('a[href="#inventory"]').click(); // Redraw UI
                alert('Aviso: Falha de ligação ao guardar. As alterações foram revertidas.');
            })
            .apiSaveInventoryItem(itemData);
    };
</script>
