                            <path d="M280.708 206.063c1.979 1.663 3.711 3.723 5.053 6.428l48.466-20.055c4.332-1.79 6.389-6.755 4.593-11.085L265.953 5.243C264.602 1.978 261.437 0 258.111 0c-1.082 0-2.188.202-3.246.643L135.319 50.119c-4.326 1.785-6.388 6.75-4.59 11.081l56.37 136.229c-3.737 3.791-8.023 8.275-13.425 13.804-19.969 20.419-19.586 32.666-25.183 67.21-3.731 22.999-13.739 31.094-9.073 44.728 3.036 8.219 7.935 14.358 11.379 18.001.523.537.96.994 1.401 1.423 1.286 1.258 2.15 1.996 2.394 2.196.722.717 1.427 1.422 2.212 2.191l-.008.009 2.661 2.604 1.429 1.395 2.645 2.601 1.422 1.395 1.431 1.395-.034.061c31.106 30.989 34.919 37.613 56.908 62.184 23.412 26.148 33.586 50.926 33.586 50.926s75.853-25.367 68.223-38.179c-7.635-12.815-10.243-31.907-10.243-31.907-2.421-44.787-37.65-101.027-35.041-101.027.185 0 .557.276 1.15.861 5.205 5.19 8.836 8.02 13.068 8.02 2.997 0 6.287-1.427 10.644-4.44 10.487-7.253-10.411-29.731-10.411-29.731s4.812-1.302 11.221-10.892c6.403-9.598-32.974-30.038-32.974-30.038s16.799-3.4 9.906-17.783c-.076-.165-.16-.283-.244-.437-1.555-3.069-3.467-5.025-5.507-6.235-2.412-1.427-5.005-1.859-7.441-1.859-3.13 0-5.979.659-7.851.659-.958 0-1.655-.172-1.995-.697-1.944-3.072-4.941-11.313-4.941-11.313-5.391-14.792-11.786-18.755-17.098-18.755-6.113 0-10.786 5.26-10.786 5.26s-17.985 11.475-8.849 51.081c.059.23.08.433.134.667.591 2.499 1.132 4.885 1.611 7.157 7.276 34.22 2.748 43.053 2.748 43.053-3.196 2.744-6.156 3.843-8.838 3.843-5.601 0-9.993-4.733-12.83-8.977-.28-.846-.549-1.735-.801-2.642-.227-.809-.437-1.654-.637-2.496-2.981-12.68-3.522-29.21-3.561-30.545l1.396-2.023c1.407-2.897 3.1-5.274 4.829-7.41l1.875 4.544c1.348 3.266 4.514 5.241 7.842 5.241 1.084 0 2.184-.212 3.242-.641l1.02-.433c-.517-2.469-1.074-5.021-1.725-7.777 0-.014-.008-.03-.008-.038l-2.529 1.042c-.046 0-.431-.006-.587-.391l-3.07-7.42h-.008l-.637-1.537-1.185-2.875-12.754-30.982c-.016.016-.036.024-.044.04L137.98 58.193c-.134-.32.024-.689.345-.823L257.87 7.896c.085-.032.161-.046.245-.046.048 0 .433.006.593.395l72.875 176.104c.132.322-.024.689-.345.823z"/>
                            <path d="M211.57 203.691c-.081.096-.119.222-.205.307.032.142.062.471.1.881.043-.386.059-.801.105-1.188M220.769 181.021c.277-.307.533-.581.793-.84-.172.108-.336.227-.509.339-.032.052-.032.102-.054.164-.072.101-.164.219-.23.337M238.042 164.685c2.328 3.062 5.706 4.875 9.474 5.093.244.016.473.12.733.12 1.727 0 3.434-.347 5.105-1.036 7.017-2.897 9.922-10.269 6.916-17.524-2.945-7.089-10.362-10.361-17.271-7.514-3.362 1.391-5.915 3.959-7.18 7.226-1.238 3.208-1.146 6.869.274 10.293.512 1.238 1.187 2.346 1.949 3.342M249.59 135.981l-29.27-77.008-21.231 8.782 33.708 75.176z"/>
                        </svg>
                    </button>
                </div>
            ` : '';

            return `
                <div class="${rowClasses}" onclick="window.handleSubClick('${p.playerId}', ${isOnPitch})">
                    <div class="flex-1 min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">
                        <span class="text-white font-bold text-sm truncate">${info.name}</span>
                    </div>
                    ${actionIcons}
                </div>
            `;
        };


        match.participants.forEach(p => {
            if (p.team === 'A') htmlA += createPlayerRow(p, true);
            else if (p.team === 'B') htmlB += createPlayerRow(p, true);
            else htmlBench += createPlayerRow(p, false);
        });

        containerA.innerHTML = htmlA || '<p class="text-xs text-slate-500 italic p-2">Ninguém em campo.</p>';
        containerB.innerHTML = htmlB || '<p class="text-xs text-slate-500 italic p-2">Ninguém em campo.</p>';
        containerBench.innerHTML = htmlBench || '<p class="text-xs text-slate-500 italic p-2">Nenhum jogador no banco.</p>';

        const instruction = document.getElementById('sub-instruction');
        if (instruction) instruction.classList.toggle('hidden', !window.activeSubPlayerId);
    };

    window.updateScore = (team, amount) => {
        const match = window.currentActiveMatch;
        const key = team === 'A' ? 'teamA' : 'teamB';
        match.score[key] = Math.max(0, match.score[key] + amount);
        window.renderOngoingView();
        google.script.run.apiSaveMatch(match);
    };

    window.logInlineEvent = (playerId, type, team) => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) return;

        const match = window.currentActiveMatch;
        match.events.push({
            id: 'ev_' + Date.now(),
            type: type,
            team: team,
            playerId: playerId,
            timestamp: new Date().toISOString()
        });

        if (type === 'GOAL' || type === 'GOALP') {
            match.score[`team${team}`]++;
        }

        window.renderOngoingView();
        google.script.run.apiSaveMatch(match);
    };

    window.handleSubClick = (clickedPlayerId, isOnPitch) => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) return;

        const match = window.currentActiveMatch;

        if (!isOnPitch) {
            if (window.activeSubPlayerId === clickedPlayerId) {
                window.activeSubPlayerId = null;
            } else {
                window.activeSubPlayerId = clickedPlayerId;
            }
            window.renderOngoingView();

        } else if (isOnPitch && window.activeSubPlayerId) {
            const pBench = match.participants.find(p => p.playerId === window.activeSubPlayerId);
            const pPitch = match.participants.find(p => p.playerId === clickedPlayerId);

            const targetTeam = pPitch.team;

            match.events.push({
                id: 'ev_sub_' + Date.now(),
                type: 'SUBSTITUTION',
                team: targetTeam,
                playerIn: pBench.playerId,
                playerOut: pPitch.playerId,
                timestamp: new Date().toISOString()
            });

            pBench.team = targetTeam;
            pPitch.team = null;

            window.activeSubPlayerId = null;

            window.renderOngoingView();
            google.script.run.apiSaveMatch(match);
        }
    };

    // --- LATE ARRIVAL (MODAL & SEARCH LOGIC) ---
    window.uncalledPlayersCache = [];
    window.currentSearchQuery = "";

    window.promptLatePlayer = () => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) return;

        const allPlayers = window.APP_DATA.players || [];
        window.uncalledPlayersCache = allPlayers.filter(pl => !window.currentActiveMatch.participants.some(p => p.playerId === pl.id));

        if (window.uncalledPlayersCache.length === 0) {
            alert("Todos os jogadores registados já estão no jogo ou no banco.");
            return;
        }

        // Reset modal state
        document.getElementById('late-player-search').value = '';
        window.filterLatePlayers('');

        // Show modal
        document.getElementById('modal-late-player').classList.remove('hidden');
        setTimeout(() => document.getElementById('late-player-search').focus(), 100);
    };

    window.closeLatePlayerModal = () => {
        document.getElementById('modal-late-player').classList.add('hidden');
    };

    window.filterLatePlayers = (query) => {
        window.currentSearchQuery = query.trim();
        const resultsContainer = document.getElementById('late-player-results');
        const guestPrompt = document.getElementById('late-player-guest-prompt');

        const lowerQuery = query.toLowerCase();
        const filtered = window.uncalledPlayersCache.filter(p => p.name.toLowerCase().includes(lowerQuery));

        // Render list
        resultsContainer.innerHTML = filtered.map(p => `
            <button onclick="window.addSpecificLatePlayer('${p.id}')" class="w-full text-left bg-background-dark/50 hover:bg-slate-800 border border-slate-800 p-3 rounded flex items-center justify-between transition-colors group">
                <span class="text-white font-bold text-sm group-hover:text-primary transition-colors">${p.name}</span>
                <span class="text-slate-500 text-[10px] uppercase tracking-widest">ID: ${p.id.substring(0, 6)}...</span>
            </button>
        `).join('');

        // Toggle guest prompt if no results and user typed something
        if (filtered.length === 0 && query.trim() !== '') {
            guestPrompt.classList.remove('hidden');
        } else {
            guestPrompt.classList.add('hidden');
        }
    };

    window.createGuestLatePlayer = () => {
        const guestName = window.currentSearchQuery + " (Convidado)";
        const guestId = 'guest_' + Date.now();

        // Add temporary player to local APP_DATA so the renderer finds their name
        if (!window.APP_DATA.players) window.APP_DATA.players = [];
        window.APP_DATA.players.push({
            id: guestId,
            name: guestName,
            positions: ['MED'], // Default position
            email: ''
        });

        // Add to match
        window.addSpecificLatePlayer(guestId);
    };

    window.addSpecificLatePlayer = (playerId) => {
        const match = window.currentActiveMatch;
        const teamACount = match.participants.filter(p => p.team === 'A').length;
        const teamBCount = match.participants.filter(p => p.team === 'B').length;

        // Intelligently assign to pitch if missing players, otherwise bench
        let assignedTeam = null;
        if (teamACount < 9 && teamACount <= teamBCount) assignedTeam = 'A';
        else if (teamBCount < 9 && teamBCount < teamACount) assignedTeam = 'B';

        match.participants.push({
            playerId: playerId,
            isAttending: true,
            arrivalTime: new Date().toISOString(),
            firstTeam: assignedTeam !== null,
            team: assignedTeam,
            position: 'MED', // Safe fallback
            draft: null,
            earnedPriority: assignedTeam === null // Earns priority if benched
        });

        window.renderOngoingView();
        google.script.run.apiSaveMatch(match);
        window.closeLatePlayerModal();

        // Brief visual feedback (optional, since the UI update is usually obvious enough)
        // alert(assignedTeam ? `Adicionado diretamente à equipa ${assignedTeam === 'A' ? 'Vermelha' : 'Roxa'}!` : "Adicionado ao Banco de Suplentes.");
    };


    window.finishMatch = () => {
        if (confirm('Terminar a partida e ir para o resumo? (Poderá editar estatísticas no resumo)')) {
            window.currentActiveMatch.status = 'FINISHED';
            window.renderMatchBoardState();
            google.script.run.apiSaveMatch(window.currentActiveMatch);
        }
    };
</script>
