<script>
    document.addEventListener('DOMContentLoaded', () => {
        const db = window.APP_DATA;
        if (!db) return;

        const matches = db.matches || [];
        const players = db.players || [];

        // --- GLOBAL STATS ---
        const totalMatches = matches.length;
        let totalGoals = 0;
        let assistCounts = {};
        let attendanceCounts = {};

        // 1. Build a Player Dictionary for easy name lookups
        const playerMap = {};
        players.forEach(p => {
            if (p.id) playerMap[String(p.id).trim()] = p.name || 'Desconhecido';
        });

        // 2. Crunch the Numbers
        matches.forEach(match => {
            const goalsA = match.score?.teamA || 0;
            const goalsB = match.score?.teamB || 0;
            totalGoals += (goalsA + goalsB);

            // Only count stats for Finished Games
            if (match.status === 'FINISHED' || match.status === 'COMPLETED') {

                // Count Attendances (Regularity)
                if (match.participants) {
                    match.participants.forEach(p => {
                        if (p.firstTeam) { // If they made the pitch
                            const pId = String(p.playerId).trim();
                            attendanceCounts[pId] = (attendanceCounts[pId] || 0) + 1;
                        }
                    });
                }

                // Count Assists
                if (match.events) {
                    match.events.forEach(ev => {
                        if (ev.type === 'ASSIST') {
                            const pId = String(ev.playerId).trim();
                            assistCounts[pId] = (assistCounts[pId] || 0) + 1;
                        }
                    });
                }
            }
        });

        const activePlayers = players.filter(p => !p.removedAt).length;
        const avgGoals = totalMatches > 0 ? (totalGoals / totalMatches).toFixed(1) : 0;

        // Helper to safely update elements
        const updateEl = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.innerText = val;
        };

        updateEl('stat-matches', totalMatches);
        updateEl('stat-goals', totalGoals);
        updateEl('stat-players', activePlayers);
        updateEl('stat-avg', avgGoals);


        // --- LEADERBOARDS (Tables) ---

        // Helper to render Leaderboard Tables
        const renderLeaderboard = (containerId, dataArray, emptyMessage, highlightColorClass) => {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (dataArray.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-6">${emptyMessage}</p>`;
                return;
            }

            let tableHTML = `<table class="w-full text-left border-collapse"><tbody>`;
            dataArray.forEach((player, index) => {
                const isFirst = index === 0;
                const bgClass = index % 2 === 0 ? 'bg-surface' : 'bg-[#111111]';
                const rankColor = isFirst ? highlightColorClass : 'text-slate-500';
                const nameColor = isFirst ? 'text-white' : 'text-slate-300';
                const valColor = isFirst ? highlightColorClass : 'text-white';

                tableHTML += `
                    <tr class="border-b border-slate-800 ${bgClass} hover:bg-white/5 transition-colors">
                        <td class="py-2.5 px-4 text-center ${rankColor} font-display text-lg w-10">${index + 1}</td>
                        <td class="py-2.5 px-4 ${nameColor} font-bold text-sm truncate max-w-[150px]">${player.name}</td>
                        <td class="py-2.5 px-4 text-right font-display text-xl ${valColor}">${player.value}</td>
                    </tr>
                `;
            });
            tableHTML += `</tbody></table>`;
            container.innerHTML = tableHTML;
            container.classList.remove("p-4"); // Remove padding so table spans edge-to-edge
        };

        // 1. Golden Boot (Goals) - Top 10
        const goalCounts = {};
        matches.forEach(m => {
            if (m.events && (m.status === 'FINISHED' || m.status === 'COMPLETED')) {
                m.events.forEach(ev => {
                    if (ev.type === 'GOAL' || ev.type === 'GOALP') {
                        const pId = String(ev.playerId).trim();
                        goalCounts[pId] = (goalCounts[pId] || 0) + 1;
                    }
                });
            }
        });

        const goldenBootStandings = Object.keys(goalCounts)
            .map(id => ({ name: playerMap[id] || 'Desconhecido', value: goalCounts[id] }))
            .sort((a, b) => b.value - a.value)
            .slice(0, 10);

        renderLeaderboard('golden-boot-container', goldenBootStandings, 'Ainda não há golos.', 'text-primary');

        // 2. Assists - Top 3
        const assistStandings = Object.keys(assistCounts)
            .map(id => ({ name: playerMap[id] || 'Desconhecido', value: assistCounts[id] }))
            .sort((a, b) => b.value - a.value)
            .slice(0, 3);

        renderLeaderboard('assists-container', assistStandings, 'Ainda não há assistências.', 'text-purple-500');

        // 3. Regularity - Top 3
        const regularityStandings = Object.keys(attendanceCounts)
            .map(id => ({ name: playerMap[id] || 'Desconhecido', value: attendanceCounts[id] }))
            .sort((a, b) => b.value - a.value)
            .slice(0, 3);

        renderLeaderboard('regularity-container', regularityStandings, 'Ainda não há jogos finalizados.', 'text-amber-500');


        // --- CALENDAR: PRÓXIMAS JORNADAS ---
        const upcomingContainer = document.getElementById('upcoming-sundays-container');
        if (upcomingContainer) {
            let sundaysHTML = '';
            const today = new Date();
            let nextSunday = new Date(today);

            // Find out when the immediate next Sunday is
            const daysToSunday = 7 - today.getDay();
            if (today.getDay() !== 0) {
                nextSunday.setDate(today.getDate() + daysToSunday);
            }

            // Loop through the next 10 weeks
            for (let i = 0; i < 10; i++) {
                const d = new Date(nextSunday);
                d.setDate(d.getDate() + (i * 7));
                const dateStr = d.toISOString().split('T')[0];
                const displayDate = d.toLocaleDateString('pt-PT', { day: '2-digit', month: 'long', year: 'numeric' });

                const existingMatch = matches.find(m => m.date === dateStr);

                if (existingMatch) {
                    sundaysHTML += `
                    <div class="flex items-center justify-between p-3 bg-background-dark border border-slate-800 rounded opacity-80">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-green-500">check_circle</span>
                            <div>
                                <p class="text-white font-bold text-sm uppercase tracking-widest">${displayDate}</p>
                                <p class="text-slate-500 text-xs truncate max-w-[120px] sm:max-w-xs">${existingMatch.opponent || 'Jogo Agendado'}</p>
                            </div>
                        </div>
                        <button onclick="window.openMatch('${existingMatch.id}')" class="text-xs bg-slate-800 text-white px-4 py-2 hover:bg-slate-700 transition-colors rounded uppercase font-bold tracking-widest border border-slate-700 flex-shrink-0">Ver Jogo</button>
                    </div>
                `;
                } else {
                    sundaysHTML += `
                    <div class="flex items-center justify-between p-3 bg-primary/5 border border-primary/20 rounded">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary">calendar_add_on</span>
                            <div>
                                <p class="text-primary font-bold text-sm uppercase tracking-widest">${displayDate}</p>
                                <p class="text-slate-400 text-xs">Data disponível</p>
                            </div>
                        </div>
                        <button onclick="window.quickCreateMatch('${dateStr}')" class="admin-only hidden text-xs bg-primary text-background-dark px-4 py-2 hover:bg-white transition-colors rounded uppercase font-bold tracking-widest shadow-hard flex-shrink-0">+ Criar</button>
                    </div>
                `;
                }
            }
            upcomingContainer.innerHTML = sundaysHTML;

            if (typeof window.updateAdminUI === 'function') window.updateAdminUI();
        }
    });

    window.quickCreateMatch = (dateStr) => {
        if (!window.APP_STATE || !window.APP_STATE.isAdmin) return alert("Apenas o Mister pode agendar jogos.");

        if (typeof window.openMatchModal === 'function') {
            window.openMatchModal();

            setTimeout(() => {
                const dateInput = document.getElementById('match-date');
                if (dateInput) dateInput.value = dateStr;
            }, 50);
        }
    };
</script>
