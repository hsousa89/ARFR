<script>
    // ==========================================
    // GLOBAL STATE
    // ==========================================
    window.currentActiveMatch = null;

    // ==========================================
    // MATCH BOARD: CORE STATE MANAGER
    // ==========================================

    window.initMatchBoard = (matchId) => {
        if (!window.APP_DATA || !window.APP_DATA.matches) {
            console.warn('Data not ready yet. Waiting for initial load...');
            return;
        }
        const matches = window.APP_DATA.matches || [];
        const match = matches.find(m => m.id === matchId);

        if (!match) {
            console.error('Match not found:', matchId);
            window.location.hash = '#matches';
            return;
        }

        window.currentActiveMatch = match;

        // Update Header UI
        const matchDate = new Date(match.date);
        const dateString = isNaN(matchDate) ? 'Data Desconhecida' : matchDate.toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });

        document.getElementById('board-match-title').innerText = match.opponent || 'Treino Interno';
        document.getElementById('board-match-subtitle').innerHTML = `
            <span class="material-symbols-outlined text-[14px] align-middle">calendar_today</span> ${dateString} 
            &nbsp;&nbsp;|&nbsp;&nbsp; 
            <span class="material-symbols-outlined text-[14px] align-middle">location_on</span> ${match.location || 'Campo Habitual'}
        `;

        window.renderMatchBoardState();
    };

    window.renderMatchBoardState = () => {
        const match = window.currentActiveMatch;
        const status = match.status || 'PRE-DRAFT';

        // View containers
        const viewPreDraft = document.getElementById('view-pre-draft');
        const viewSort = document.getElementById('view-sort');
        const viewDraft = document.getElementById('view-draft-container');
        const viewOngoing = document.getElementById('view-ongoing');
        const viewFinished = document.getElementById('view-finished');

        // Hide all initially
        if (viewPreDraft) viewPreDraft.classList.add('hidden');
        if (viewSort) viewSort.classList.add('hidden');
        if (viewDraft) viewDraft.classList.add('hidden');
        if (viewOngoing) viewOngoing.classList.add('hidden');
        if (viewFinished) viewFinished.classList.add('hidden');

        // Main Action Button
        const btnMainAction = document.getElementById('btn-run-draft');
        if (btnMainAction) btnMainAction.classList.remove('hidden');

        // State Machine
        switch (status) {
            case 'PRE-DRAFT':
                if (viewPreDraft) viewPreDraft.classList.remove('hidden');
                if (btnMainAction) {
                    btnMainAction.innerHTML = '<span class="material-symbols-outlined align-middle mr-2 text-sm">sort</span> Fechar & Ordenar Lista';
                    btnMainAction.className = 'admin-only bg-yellow-500 text-background-dark px-6 py-2 font-bold text-sm uppercase tracking-widest hover:bg-yellow-400 transition-all shadow-hard';
                    btnMainAction.onclick = () => window.advanceToSort();
                }
                window.renderPreDraftColumns();
                break;

            case 'SORT':
                if (viewSort) viewSort.classList.remove('hidden');
                if (btnMainAction) {
                    btnMainAction.innerHTML = '<span class="material-symbols-outlined align-middle mr-2 text-sm">casino</span> Gerar Equipas Equilibradas';
                    btnMainAction.className = 'admin-only bg-primary text-background-dark px-6 py-2 font-bold text-sm uppercase tracking-widest hover:bg-white transition-all shadow-hard';
                    btnMainAction.onclick = () => window.advanceToDraft();
                }
                window.renderSortView();
                break;

            case 'DRAFT':
                // Note: viewDraft removes flex-col hiding, use specific class logic if needed
                if (viewDraft) {
                    viewDraft.classList.remove('hidden');
                    viewDraft.classList.add('flex'); // Because our HTML uses flex-col for the draft container
                }
                if (btnMainAction) {
                    btnMainAction.innerHTML = '<span class="material-symbols-outlined align-middle mr-2 text-sm">play_arrow</span> Iniciar Jogo';
                    btnMainAction.className = 'admin-only bg-green-500 text-background-dark px-6 py-2 font-bold text-sm uppercase tracking-widest hover:bg-green-400 transition-all shadow-hard';
                    btnMainAction.onclick = () => window.startMatch();
                }
                window.renderDraftView();
                break;

            case 'ONGOING':
                if (viewOngoing) viewOngoing.classList.remove('hidden');
                if (btnMainAction) btnMainAction.classList.add('hidden');
                if (typeof window.renderOngoingView === 'function') window.renderOngoingView();
                break;

            case 'FINISHED':
            case 'COMPLETED':
                if (viewFinished) viewFinished.classList.remove('hidden');
                if (btnMainAction) btnMainAction.classList.add('hidden');
                break;
        }
    };

    // ==========================================
    // PRE-DRAFT PHASE: PLANTEL VS CONVOCADOS
    // ==========================================

    window.renderPreDraftColumns = () => {
        const allPlayers = window.APP_DATA.players || [];
        const match = window.currentActiveMatch;
        if (!match) return;

        const attendingParticipants = match.participants || [];
        const attendingIds = attendingParticipants.map(p => p.playerId);

        let htmlAvailable = '';
        let htmlAttending = '';
        const CAPACITY = 18;

        const availablePlayers = allPlayers.filter(pl => !attendingIds.includes(pl.id));

        availablePlayers.sort((a, b) => a.name.localeCompare(b.name)).forEach(player => {
            htmlAvailable += createPlayerRow(player, false);
        });

        attendingParticipants.forEach((p, index) => {
            const playerInfo = allPlayers.find(pl => pl.id === p.playerId) || { id: p.playerId, name: 'Convidado', positions: [p.position || 'MED'] };
            if (index === CAPACITY) {
                htmlAttending += `
                    <div class="flex items-center gap-4 my-4">
                        <div class="flex-1 border-t-2 border-dashed border-red-500/50"></div>
                        <span class="text-red-500 text-[10px] font-bold uppercase tracking-widest bg-background-dark px-2">Lista de Espera</span>
                        <div class="flex-1 border-t-2 border-dashed border-red-500/50"></div>
                    </div>
                `;
            }
            const isWaitlisted = index >= CAPACITY;
            htmlAttending += createPlayerRow(playerInfo, true, isWaitlisted);
        });

        const listAvailableEl = document.getElementById('list-available');
        const listAttendingEl = document.getElementById('list-attending');
        if (listAvailableEl) listAvailableEl.innerHTML = htmlAvailable || '<p class="text-slate-500 text-xs p-4 text-center">Todos convocados.</p>';
        if (listAttendingEl) listAttendingEl.innerHTML = htmlAttending || '<p class="text-slate-500 text-xs p-4 text-center">Nenhum jogador convocado ainda.</p>';

        const countAttendingEl = document.getElementById('count-attending');
        const countRosterEl = document.getElementById('count-roster');
        if (countAttendingEl) {
            countAttendingEl.innerText = attendingParticipants.length;
            countAttendingEl.className = attendingParticipants.length > CAPACITY ? 'text-red-500 font-bold text-lg' : 'text-white font-bold text-lg';
        }
        if (countRosterEl) countRosterEl.innerText = availablePlayers.length;
    };

    function createPlayerRow(player, isAttending, isWaitlisted = false) {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        const bgColor = isWaitlisted ? 'bg-red-950/20' : 'bg-background-dark';
        const borderColor = isWaitlisted ? 'border-red-900/50' : 'border-slate-800';
        const pos = (player.positions && player.positions[0]) ? player.positions[0] : 'MED';
        const cursorStyle = isAdmin ? 'cursor-pointer hover:border-primary/50 group' : 'cursor-default';
        const clickEvent = isAdmin ? `onclick="window.togglePlayerAttendance('${player.id}')"` : '';
        const icon = isAttending ? 'remove_circle' : 'add_circle';
        const iconColor = isAttending ? 'text-red-500/70 hover:text-red-500' : 'text-green-500/70 hover:text-green-500';
        const iconHtml = isAdmin ? `<span class="material-symbols-outlined ${iconColor} transition-colors text-xl">${icon}</span>` : '';

        return `
            <div class="flex items-center justify-between ${bgColor} border ${borderColor} p-3 mb-2 transition-all shadow-sm ${cursorStyle}" ${clickEvent}>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-[10px] font-bold text-slate-400">${pos}</div>
                    <span class="text-white font-bold text-sm tracking-wide ${isAdmin ? 'group-hover:text-primary transition-colors' : ''}">${player.name}</span>
                    ${isWaitlisted ? '<span class="text-[9px] bg-red-500/10 border border-red-500/20 text-red-500 px-1.5 py-0.5 rounded uppercase tracking-widest">Espera</span>' : ''}
                </div>
                ${iconHtml}
            </div>
        `;
    }

    window.togglePlayerAttendance = (playerId) => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) {
            alert("Acesso Negado: Apenas o Mister pode alterar as convocatórias.");
            return;
        }

        const match = window.currentActiveMatch;
        const index = match.participants.findIndex(p => p.playerId === playerId);

        if (index > -1) {
            match.participants.splice(index, 1);
        } else {
            const playerDb = window.APP_DATA.players.find(p => p.id === playerId);
            const defaultPos = (playerDb && playerDb.positions && playerDb.positions.length > 0) ? playerDb.positions[0] : 'MED';
            match.participants.push({
                playerId: playerId,
                isAttending: true,
                arrivalTime: new Date().toISOString(),
                firstTeam: false,
                team: null,
                position: defaultPos,
                draft: null
            });
        }

        window.renderPreDraftColumns();
        if (window.google && google.script && google.script.run) {
            google.script.run.apiSaveMatch(match);
        }
    };

    // ==========================================
    // QUICK GUEST CONTROLLER
    // ==========================================

    window.openGuestModal = () => {
        const isAdmin = window.APP_STATE ? window.APP_STATE.isAdmin : false;
        if (!isAdmin) return alert("Apenas o Mister pode convocar jogadores.");
        document.getElementById('form-guest').reset();
        document.getElementById('modal-guest').classList.remove('hidden');
    };

    window.closeGuestModal = () => document.getElementById('modal-guest').classList.add('hidden');

    window.handleQuickAddGuest = (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('guest-name').value.trim();
        const posInput = document.getElementById('guest-pos').value;
        const playerId = 'p_guest_' + Date.now();

        const newGuest = {
            id: playerId, name: nameInput + ' (C)', email: '', positions: [posInput], status: 'ACTIVE', isGuest: true
        };

        if (!window.APP_DATA.players) window.APP_DATA.players = [];
        window.APP_DATA.players.push(newGuest);

        const match = window.currentActiveMatch;
        match.participants.push({
            playerId: playerId, isAttending: true, arrivalTime: new Date().toISOString(), firstTeam: false, team: null, position: posInput, draft: null
        });

        window.closeGuestModal();
        window.renderPreDraftColumns();
        google.script.run.apiSaveMatch(match);
        if (google.script.run.apiSavePlayer) google.script.run.apiSavePlayer(newGuest);
    };

    // ==========================================
    // PHASE 1: SORTING LOGIC & UI
    // ==========================================

    window.advanceToSort = () => {
        const match = window.currentActiveMatch;
        if (match.participants.length < 14) return alert("Precisa de pelo menos 14 jogadores para ordenar.");
        if (!confirm('Deseja fechar a convocatória e calcular a ordem de entrada (prioridades, etc)?')) return;

        const allPlayers = window.APP_DATA.players || [];
        const matchesHistory = window.APP_DATA.matches || [];

        const fullParticipants = match.participants.map(p => {
            const dbPlayer = allPlayers.find(pl => pl.id === p.playerId) || { entersDraft: true, isShiftWorker: false, positions: [p.position || 'MED'] };
            return { ...p, ...dbPlayer };
        });

        const sortedHistory = [...matchesHistory].sort((a, b) => new Date(b.date) - new Date(a.date));
        const pastMatches = sortedHistory.filter(m => m.id !== match.id && m.status !== 'PRE-DRAFT');
        const lastPlayedMatch = pastMatches.length > 0 ? pastMatches[0] : null;

        fullParticipants.forEach(player => {
            player.hasPriority = false;
            if (player.entersDraft === false) return;

            let matchToEvaluate = null;
            if (player.isShiftWorker) {
                matchToEvaluate = pastMatches.find(m => m.participants.some(p => p.playerId === player.id && p.isAttending));
            } else if (lastPlayedMatch) {
                const attendedLast = lastPlayedMatch.participants.some(p => p.playerId === player.id && p.isAttending);
                if (attendedLast) matchToEvaluate = lastPlayedMatch;
            }

            if (matchToEvaluate) {
                const pRecord = matchToEvaluate.participants.find(p => p.playerId === player.id);
                if (pRecord && (pRecord.earnedPriority === true || pRecord.firstTeam === false)) {
                    player.hasPriority = true;
                }
            }
        });

        const priorityPlayers = fullParticipants.filter(p => p.hasPriority);
        const remainingPlayers = fullParticipants.filter(p => !p.hasPriority);
        const pureGRs = remainingPlayers.filter(p => p.entersDraft === true && p.positions && p.positions.length === 1 && p.positions[0] === 'GR');

        let regularDraftPool = remainingPlayers.filter(p => p.entersDraft === true && !(p.positions && p.positions.length === 1 && p.positions[0] === 'GR'));

        for (let i = regularDraftPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [regularDraftPool[i], regularDraftPool[j]] = [regularDraftPool[j], regularDraftPool[i]];
        }

        const nonDrafters = remainingPlayers.filter(p => p.entersDraft === false);
        const finalSorted = [...priorityPlayers, ...pureGRs, ...regularDraftPool, ...nonDrafters];
        const CAPACITY = 18;

        match.participants = finalSorted.map((p, index) => {
            const isFirstTeam = index < CAPACITY;
            return {
                playerId: p.playerId || p.id,
                isAttending: true,
                arrivalTime: p.arrivalTime || null,
                firstTeam: isFirstTeam,
                team: null,
                position: p.position || (p.positions ? p.positions[0] : 'MED'),
                draft: null,
                earnedPriority: !isFirstTeam
            };
        });

        match.status = 'SORT';
        window.renderMatchBoardState();
        google.script.run.apiSaveMatch(match);
    };

    window.renderSortView = () => {
        const match = window.currentActiveMatch;
        const allPlayers = window.APP_DATA.players || [];
        const container = document.getElementById('list-sorted-players');
        if (!container) return;

        let html = '';
        const CAPACITY = 18;

        match.participants.forEach((p, index) => {
            const playerDb = allPlayers.find(pl => pl.id === p.playerId) || { name: 'Desconhecido' };
            const isWaitlisted = index >= CAPACITY;

            if (index === CAPACITY) {
                html += `
                    <div class="flex items-center gap-4 my-2">
                        <div class="flex-1 border-t-2 border-dashed border-red-500/50"></div>
                        <span class="text-red-500 text-[10px] font-bold uppercase tracking-widest bg-surface px-2">Linha de Corte (Lista de Espera)</span>
                        <div class="flex-1 border-t-2 border-dashed border-red-500/50"></div>
                    </div>
                `;
            }

            const badge = isWaitlisted
                ? '<span class="text-[9px] bg-red-500/20 text-red-500 px-2 py-1 rounded border border-red-500/30 uppercase tracking-widest">+ Prioridade Ganha</span>'
                : '<span class="text-[9px] bg-green-500/20 text-green-500 px-2 py-1 rounded border border-green-500/30 uppercase tracking-widest">Plantel Principal</span>';

            html += `
                <div class="flex items-center justify-between bg-background-dark border ${isWaitlisted ? 'border-red-900/30' : 'border-slate-800'} p-3 rounded">
                    <div class="flex items-center gap-4">
                        <span class="text-slate-500 font-mono text-xs w-4 text-right">${index + 1}.</span>
                        <span class="text-white font-bold text-sm">${playerDb.name}</span>
                    </div>
                    ${badge}
                </div>
            `;
        });
        container.innerHTML = html;
    };

    // ==========================================
    // PHASE 2: DRAFTING LOGIC
    // ==========================================

    window.calculatePlayerRating = (playerId) => {
        const matches = window.APP_DATA.matches || [];
        const pastMatches = matches
            .filter(m => (m.status === 'FINISHED' || m.status === 'COMPLETED') && m.participants.some(p => p.playerId === playerId))
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .slice(0, 10);

        if (pastMatches.length === 0) return 50;

        let wins = 0;
        pastMatches.forEach(m => {
            const pData = m.participants.find(p => p.playerId === playerId);
            if (!pData || !pData.team) return;
            const isTeamA = pData.team === 'A';
            const scoreA = m.score?.teamA || 0;
            const scoreB = m.score?.teamB || 0;
            if (isTeamA && scoreA > scoreB) wins++;
            if (!isTeamA && scoreB > scoreA) wins++;
        });

        return Math.round((wins / pastMatches.length) * 100);
    };

    window.advanceToDraft = () => {
        const match = window.currentActiveMatch;
        if (!confirm('Deseja distribuir os jogadores principais pelas Equipas A e B?')) return;

        const topPlayers = match.participants.filter(p => p.firstTeam === true);
        const waitlistPlayers = match.participants.filter(p => p.firstTeam === false);

        const getBucket = (pos) => {
            if (pos === 'GR') return 'GR';
            if (['DC', 'LD', 'LE'].includes(pos)) return 'DEF';
            if (pos === 'MED') return 'MED';
            return 'AV';
        };

        const draftablePlayers = topPlayers.map(p => ({
            ...p,
            rating: window.calculatePlayerRating(p.playerId),
            bucket: getBucket(p.position)
        }));

        const buckets = {
            'GR': draftablePlayers.filter(p => p.bucket === 'GR'),
            'DEF': draftablePlayers.filter(p => p.bucket === 'DEF'),
            'MED': draftablePlayers.filter(p => p.bucket === 'MED'),
            'AV': draftablePlayers.filter(p => p.bucket === 'AV')
        };

        const teamA = [];
        const teamB = [];
        let scoreA = 0;
        let scoreB = 0;
        const maxTeamSize = Math.ceil(topPlayers.length / 2);

        const distributeBucket = (playerList) => {
            playerList.sort((a, b) => b.rating - a.rating);
            playerList.forEach(player => {
                if (teamA.length >= maxTeamSize) {
                    teamB.push({ ...player, team: 'B' });
                } else if (teamB.length >= maxTeamSize) {
                    teamA.push({ ...player, team: 'A' });
                } else if (scoreA <= scoreB) {
                    teamA.push({ ...player, team: 'A' });
                    scoreA += player.rating;
                } else {
                    teamB.push({ ...player, team: 'B' });
                    scoreB += player.rating;
                }
            });
        };

        distributeBucket(buckets['GR']);
        distributeBucket(buckets['DEF']);
        distributeBucket(buckets['MED']);
        distributeBucket(buckets['AV']);

        const draftedTopPlayers = [...teamA, ...teamB].map(p => ({
            playerId: p.playerId,
            isAttending: true,
            arrivalTime: p.arrivalTime,
            firstTeam: true,
            team: p.team,
            position: p.position,
            draft: null,
            earnedPriority: false
        }));

        match.participants = [...draftedTopPlayers, ...waitlistPlayers];
        match.status = 'DRAFT';
        window.renderMatchBoardState();
        google.script.run.apiSaveMatch(match);
    };

    window.renderDraftView = () => {
        const match = window.currentActiveMatch;
        const allPlayers = window.APP_DATA.players || [];
        const listA = document.getElementById('list-team-a');
        const listB = document.getElementById('list-team-b');

        if (!listA || !listB) return;

        let htmlA = '';
        let htmlB = '';
        let totalRatingA = 0;
        let totalRatingB = 0;
        const posOrder = { 'GR': 1, 'DC': 2, 'LD': 3, 'LE': 4, 'MED': 5, 'AT': 6, 'AV': 6 };

        const teamA = match.participants.filter(p => p.team === 'A');
        const teamB = match.participants.filter(p => p.team === 'B');

        const renderPlayerRow = (p) => {
            const playerInfo = allPlayers.find(pl => pl.id === p.playerId) || { name: 'Desconhecido' };
            const rating = window.calculatePlayerRating(p.playerId);
            const pos = p.position || (playerInfo.positions ? playerInfo.positions[0] : 'MED');

            return `
                <div class="flex items-center justify-between bg-background-dark/30 border border-slate-800 p-3 rounded mb-2 hover:border-slate-600 transition-colors">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-bold bg-slate-800 text-slate-400 w-10 py-1 rounded text-center">${pos}</span>
                        <span class="text-white font-bold text-sm">${playerInfo.name}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-[10px] text-slate-500 font-mono">${rating}% WR</span>
                        <button onclick="window.swapTeam('${p.playerId}')" class="admin-only text-slate-600 hover:text-primary transition-colors" title="Trocar de Equipa">
                            <span class="material-symbols-outlined text-sm">swap_horiz</span>
                        </button>
                    </div>
                </div>
            `;
        };

        teamA.sort((a, b) => (posOrder[a.position] || 9) - (posOrder[b.position] || 9)).forEach(p => {
            htmlA += renderPlayerRow(p);
            totalRatingA += window.calculatePlayerRating(p.playerId);
        });

        teamB.sort((a, b) => (posOrder[a.position] || 9) - (posOrder[b.position] || 9)).forEach(p => {
            htmlB += renderPlayerRow(p);
            totalRatingB += window.calculatePlayerRating(p.playerId);
        });

        listA.innerHTML = htmlA || '<p class="text-slate-500 text-sm p-4 text-center">Nenhum jogador na Equipa Vermelha.</p>';
        listB.innerHTML = htmlB || '<p class="text-slate-500 text-sm p-4 text-center">Nenhum jogador na Equipa Roxa.</p>';

        const avgA = document.getElementById('avg-rating-a');
        const avgB = document.getElementById('avg-rating-b');
        if (avgA) avgA.innerText = teamA.length > 0 ? Math.round(totalRatingA / teamA.length) + '%' : '0%';
        if (avgB) avgB.innerText = teamB.length > 0 ? Math.round(totalRatingB / teamB.length) + '%' : '0%';
    };

    window.swapTeam = (playerId) => {
        const match = window.currentActiveMatch;
        const p = match.participants.find(part => part.playerId === playerId);
        if (p) {
            p.team = (p.team === 'A') ? 'B' : 'A';
            window.renderDraftView();
            google.script.run.apiSaveMatch(match);
        }
    };

    window.reDraft = () => {
        if (confirm('Refazer o sorteio automático?')) window.advanceToDraft();
    };

    // ==========================================
    // PHASE TRANSITIONS (REVERTS)
    // ==========================================

    window.revertToPreDraft = () => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) return;
        if (!confirm('Atenção: Deseja reabrir a convocatória? Isto vai apagar a ordenação e as equipas geradas.')) return;

        const match = window.currentActiveMatch;
        match.status = 'PRE-DRAFT';
        match.participants.forEach(p => {
            p.team = null;
            p.firstTeam = false;
            p.earnedPriority = false;
        });

        window.renderMatchBoardState();
        google.script.run.apiSaveMatch(match);
    };

    window.revertToSort = () => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) return;
        if (!confirm('Atenção: Deseja apagar as equipas atuais e voltar à lista ordenada?')) return;

        const match = window.currentActiveMatch;
        match.status = 'SORT';
        match.participants.forEach(p => p.team = null);

        window.renderMatchBoardState();
        google.script.run.apiSaveMatch(match);
    };

    // ==========================================
    // START / EXIT LOGIC
    // ==========================================

    window.startMatch = () => {
        const isAdmin = window.APP_STATE && window.APP_STATE.isAdmin === true;
        if (!isAdmin) return;
        if (!confirm('Iniciar o jogo? (Poderá adicionar jogadores atrasados depois)')) return;

        const match = window.currentActiveMatch;
        match.status = 'ONGOING';
        if (!match.score) match.score = { teamA: 0, teamB: 0 };

        window.renderMatchBoardState();
        google.script.run.apiSaveMatch(match);
    };

    window.goBackToMatches = () => {
        if (typeof window.navigateToView === 'function') {
            window.navigateToView('matches');
        } else {
            document.querySelectorAll('.app-view').forEach(v => {
                v.classList.remove('block');
                v.classList.add('hidden');
            });
            const matchesView = document.getElementById('view-matches');
            if (matchesView) {
                matchesView.classList.remove('hidden');
                matchesView.classList.add('block');
            }
        }
    };
</script>
