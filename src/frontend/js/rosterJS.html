<script>
    window.rosterSearchQuery = "";

    // 1. POSITION COLOR UTILITY (Use this everywhere!)
    window.getPositionStyle = (pos) => {
        switch (pos) {
            case 'GR': return 'bg-amber-500/20 text-amber-500 border-amber-500/30';
            case 'DC': case 'LD': case 'LE': return 'bg-blue-500/20 text-blue-500 border-blue-500/30';
            case 'MED': return 'bg-green-500/20 text-green-500 border-green-500/30';
            case 'AT': case 'AV': return 'bg-red-500/20 text-red-500 border-red-500/30';
            default: return 'bg-slate-500/20 text-slate-400 border-slate-500/30';
        }
    };

    // 2. DYNAMIC WIN RATIO CALCULATION
    window.calculatePlayerWinRatio = (playerId) => {
        const matches = window.APP_DATA.matches || [];
        const pastMatches = matches.filter(m => (m.status === 'FINISHED' || m.status === 'COMPLETED') && m.participants.some(p => p.playerId === playerId));

        if (pastMatches.length === 0) return 'N/A';

        let wins = 0;
        pastMatches.forEach(m => {
            const pData = m.participants.find(p => p.playerId === playerId);
            if (!pData || !pData.team) return;
            const isTeamA = pData.team === 'A';
            const scoreA = m.score?.teamA || 0;
            const scoreB = m.score?.teamB || 0;
            if (isTeamA && scoreA > scoreB) wins++;
            if (!isTeamA && scoreB > scoreA) wins++;
        });

        return Math.round((wins / pastMatches.length) * 100) + '%';
    };

    // 3. FILTER LOGIC
    window.filterRoster = (query) => {
        window.rosterSearchQuery = query.toLowerCase().trim();
        window.renderRoster();
    };

    // 4. MAIN RENDER FUNCTION
    window.renderRoster = () => {
        const db = window.APP_DATA;
        if (!db) return;

        const players = db.players || [];
        const rosterGrid = document.getElementById('roster-grid');
        if (!rosterGrid) return;

        let filteredPlayers = players;
        if (window.rosterSearchQuery) {
            filteredPlayers = players.filter(p => p.name.toLowerCase().includes(window.rosterSearchQuery));
        }

        const sortedPlayers = [...filteredPlayers].sort((a, b) => a.name.localeCompare(b.name));
        let rosterHTML = '';

        sortedPlayers.forEach(player => {
            const isActive = !player.removedAt;
            const opacityClass = isActive ? 'opacity-100' : 'opacity-50 grayscale';

            const statusBadge = isActive
                ? '<span class="bg-green-900/40 text-green-500 border border-green-900 px-2 py-0.5 text-[9px] font-bold uppercase tracking-widest rounded">Ativo</span>'
                : '<span class="bg-red-900/40 text-red-500 border border-red-900 px-2 py-0.5 text-[9px] font-bold uppercase tracking-widest rounded">Inativo</span>';

            // Position Pills
            const posPills = (player.positions || ['MED']).map(pos => {
                const style = window.getPositionStyle(pos);
                return `<span class="px-2 py-1 text-[10px] font-bold uppercase tracking-widest border rounded ${style}">${pos}</span>`;
            }).join('');

            // Dynamic Rating
            const winRatio = window.calculatePlayerWinRatio(player.id);

            // Photo or Fallback
            const photoEl = player.photo && player.photo.trim() !== ''
                ? `<img src="${player.photo}" alt="${player.name}" class="w-16 h-16 rounded-full object-cover border-2 border-slate-700">`
                : `<div class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center text-xl font-display text-slate-400">${player.name.charAt(0).toUpperCase()}</div>`;

            rosterHTML += `
            <div onclick="window.navigateToPlayerDetails('${player.id}')" class="bg-surface border border-slate-800 p-6 relative overflow-hidden group hover:border-primary/50 cursor-pointer transition-all ${opacityClass} flex flex-col gap-4 shadow-lg">
                
                <div class="absolute top-4 right-4">${statusBadge}</div>
                
                <div class="flex items-center gap-4">
                    ${photoEl}
                    <div class="flex flex-col">
                        <h3 class="text-white font-display tracking-wider text-lg group-hover:text-primary transition-colors">${player.name}</h3>
                        <p class="admin-only text-slate-500 text-xs font-mono">${player.contact || 'Sem contacto'}</p>
                    </div>
                </div>

                <div class="flex justify-between items-end mt-2 pt-4 border-t border-slate-800">
                    <div class="flex gap-2 flex-wrap">
                        ${posPills}
                    </div>
                    <div class="text-right">
                        <span class="block text-[10px] text-slate-500 uppercase tracking-widest font-bold">Win Rate</span>
                        <span class="text-white font-mono text-lg">${winRatio}</span>
                    </div>
                </div>
            </div>`;
        });

        if (sortedPlayers.length === 0) {
            rosterHTML = `<div class="col-span-1 lg:col-span-3 text-center p-12 text-slate-500 font-body uppercase tracking-widest text-sm">Nenhum jogador encontrado.</div>`;
        }

        rosterGrid.innerHTML = rosterHTML;
    };


    // Needs to be globally accessible
    window.openPlayerModal = (playerId = null) => {
        const form = document.getElementById('form-player');
        form.reset();

        document.getElementById('modal-player-title').innerText = playerId ? 'Editar Jogador' : 'Novo Jogador';
        document.getElementById('player-id').value = playerId || '';

        // Default to active/true
        document.getElementById('player-status').value = 'ACTIVE';
        document.getElementById('player-enters-draft').checked = true;

        if (playerId) {
            const player = window.APP_DATA.players.find(p => p.id === playerId);
            if (player) {
                document.getElementById('player-name').value = player.name || '';
                document.getElementById('player-email').value = player.email || '';
                document.getElementById('player-contact').value = player.contact || '';
                document.getElementById('player-photo').value = player.photo || '';
                if (player.positions && player.positions.length > 0) {
                    document.getElementById('player-position').value = player.positions[0];
                }

                document.getElementById('player-enters-draft').checked = player.entersDraft !== false;
                document.getElementById('player-is-shift-worker').checked = player.isShiftWorker === true;
                document.getElementById('player-is-admin').checked = player.isAdmin === true;
                document.getElementById('player-added').value = player.addedAt || '';

                document.getElementById('player-status').value = player.removedAt ? 'INACTIVE' : 'ACTIVE';
            }
        }

        document.getElementById('modal-player').classList.remove('hidden');
    };

    window.closePlayerModal = () => {
        document.getElementById('modal-player').classList.add('hidden');
    };

    window.handleSavePlayer = (e) => {
        e.preventDefault();

        const playerId = document.getElementById('player-id').value || 'p_' + Date.now();
        const isNew = !document.getElementById('player-id').value;
        const status = document.getElementById('player-status').value;

        const playerData = {
            id: playerId,
            name: document.getElementById('player-name').value.trim(),
            email: document.getElementById('player-email').value.trim(),
            contact: document.getElementById('player-contact').value.trim(),
            photo: document.getElementById('player-photo').value.trim(),
            positions: [document.getElementById('player-position').value], // Note: App currently supports 1 primary pos from UI
            isAdmin: document.getElementById('player-is-admin').checked,
            entersDraft: document.getElementById('player-enters-draft').checked,
            isShiftWorker: document.getElementById('player-is-shift-worker').checked,
            addedAt: document.getElementById('player-added').value || new Date().toISOString().split('T')[0],
            removedAt: status === 'INACTIVE' ? new Date().toISOString() : ''
        };

        const backupPlayers = JSON.parse(JSON.stringify(window.APP_DATA.players));

        if (!window.APP_DATA.players) window.APP_DATA.players = [];
        if (isNew) {
            window.APP_DATA.players.push(playerData);
        } else {
            const index = window.APP_DATA.players.findIndex(p => p.id === playerId);
            if (index > -1) window.APP_DATA.players[index] = playerData;
        }

        window.closePlayerModal();
        window.renderRoster(); // Re-render the roster immediately (Optimistic UI)

        // If you are looking at the player details screen, re-render that too!
        if (typeof window.renderPlayerDetailsView === 'function' && window.currentViewPlayerId === playerId) {
            window.renderPlayerDetailsView(playerId);
        }

        google.script.run
            .withFailureHandler((error) => {
                window.APP_DATA.players = backupPlayers;
                window.renderRoster();
                alert('Erro de ligação. O jogador não foi guardado.');
            })
            .apiSavePlayer(playerData);
    };
</script>
