<style>
    @media (max-width: 768px) {

        /* Ensure the main content isn't hidden underneath the new Mobile Top Bar */
        #app-root {
            padding-top: 5.5rem !important;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }
    }
</style>

<script>
    // Handles the sliding animation and dark overlay
    window.toggleSidebar = () => {
        const sidebar = document.getElementById('app-sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        if (sidebar.classList.contains('-translate-x-full')) {
            // Open Sidebar
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
        } else {
            // Close Sidebar
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }
    };

    // Automatically close the sidebar when the user taps a link on mobile
    setTimeout(() => {
        const links = document.querySelectorAll('#app-sidebar nav a');
        links.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 768) {
                    window.toggleSidebar();
                }
            });
        });
    }, 100);
</script>
