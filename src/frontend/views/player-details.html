<div id="view-player-details" class="app-view hidden flex-col w-full">

    <header
        class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-800 pb-4 gap-4">
        <div>
            <button onclick="window.goBackToRoster()"
                class="text-slate-500 hover:text-white transition-colors flex items-center gap-2 text-xs uppercase tracking-widest font-bold mb-4">
                <span class="material-symbols-outlined text-sm">arrow_back</span> Voltar ao Plantel
            </button>
            <h2 id="pd-name" class="text-primary text-4xl font-display tracking-wider uppercase">A Carregar...</h2>
            <p id="pd-status" class="text-slate-400 font-body uppercase text-sm tracking-widest mt-1">--</p>
        </div>
        <div class="flex gap-4 w-full md:w-auto">
            <button id="pd-btn-edit" onclick="window.openPlayerModal(window.currentViewPlayerId)"
                class="admin-only hidden w-full md:w-auto bg-surface border border-slate-700 text-white px-6 py-2 font-body font-bold text-sm uppercase tracking-wider hover:border-primary hover:text-primary transition-all flex justify-center items-center gap-2">
                <span class="material-symbols-outlined text-sm">edit</span> Editar Perfil
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="bg-surface border border-slate-800 p-6 flex flex-col items-center gap-4 shadow-lg h-fit">

            <div id="pd-photo-container"
                class="w-40 h-40 rounded-full overflow-hidden border-4 border-slate-700 bg-slate-800 flex items-center justify-center shadow-inner">
            </div>

            <div id="pd-positions" class="flex gap-2 flex-wrap justify-center mt-2"></div>

            <div class="w-full border-t border-slate-800 mt-4 pt-4 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Contacto</span>
                    <span id="pd-contact" class="text-white font-mono text-sm"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Email</span>
                    <span id="pd-email" class="text-white text-xs"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Membro Desde</span>
                    <span id="pd-added" class="text-white font-mono text-sm"></span>
                </div>
            </div>

            <div id="pd-badges" class="w-full border-t border-slate-800 mt-2 pt-4 flex flex-col gap-2"></div>
        </div>

        <div class="lg:col-span-2 flex flex-col gap-6">
            <h3
                class="text-xl text-white font-display uppercase tracking-widest border-b border-slate-800 pb-2 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">query_stats</span> Estatísticas Globais
            </h3>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div
                    class="bg-background-dark border border-slate-800 p-6 text-center flex flex-col justify-center shadow-sm">
                    <span class="block text-slate-500 text-[10px] uppercase tracking-widest font-bold mb-2">Jogos</span>
                    <span id="pd-stat-games" class="text-4xl font-display text-white">0</span>
                </div>
                <div
                    class="bg-background-dark border border-slate-800 p-6 text-center flex flex-col justify-center shadow-sm">
                    <span
                        class="block text-slate-500 text-[10px] uppercase tracking-widest font-bold mb-2">Vitórias</span>
                    <span id="pd-stat-winrate" class="text-4xl font-display text-primary">0%</span>
                </div>
                <div
                    class="bg-background-dark border border-slate-800 p-6 text-center flex flex-col justify-center shadow-sm">
                    <span class="block text-slate-500 text-[10px] uppercase tracking-widest font-bold mb-2">Golos</span>
                    <span id="pd-stat-goals" class="text-4xl font-display text-white">0</span>
                </div>
                <div
                    class="bg-background-dark border border-slate-800 p-6 text-center flex flex-col justify-center shadow-sm">
                    <span
                        class="block text-slate-500 text-[10px] uppercase tracking-widest font-bold mb-2">Assistências</span>
                    <span id="pd-stat-assists" class="text-4xl font-display text-white">0</span>
                </div>
            </div>

            <div class="bg-background-dark border border-slate-800 p-6 flex items-center justify-center mt-4">
                <p class="text-slate-500 text-xs uppercase tracking-widest font-bold">O histórico de jogos individuais
                    será adicionado numa atualização futura.</p>
            </div>
        </div>
    </div>
</div>
