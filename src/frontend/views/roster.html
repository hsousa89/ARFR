<div id="view-roster" class="app-view hidden flex-col gap-6 w-full">

    <header
        class="mb-2 flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-800 pb-4 gap-4">
        <div>
            <h2 class="text-primary text-5xl font-display tracking-wider uppercase">Os Amigos do Futebol e Resenha</h2>
            <p class="text-slate-400 font-body uppercase text-sm tracking-widest mt-1">Gestão de Jogadores</p>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
            <div class="relative w-full sm:w-64">
                <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500 text-sm">search</span>
                <input type="text" id="roster-search" oninput="window.filterRoster(this.value)"
                    placeholder="Procurar jogador..."
                    class="w-full bg-background-dark border border-slate-700 text-white pl-9 pr-4 py-2 rounded focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all text-sm autocomplete-off">
            </div>

            <button onclick="window.openPlayerModal()"
                class="admin-only hidden bg-surface border border-slate-700 text-white px-6 py-2 font-body font-bold text-sm uppercase tracking-wider hover:border-primary hover:text-primary transition-all w-full sm:w-auto whitespace-nowrap">
                + Novo Jogador
            </button>
        </div>
    </header>

    <div id="roster-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    </div>
</div>
