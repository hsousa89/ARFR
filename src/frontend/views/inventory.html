<div id="view-inventory" class="app-view hidden">
    <header
        class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-800 pb-4 gap-4">
        <div>
            <h2 class="text-primary text-5xl font-display tracking-wider">INVENTÁRIO</h2>
            <p class="text-slate-400 font-body uppercase text-sm tracking-widest mt-1">Gestão de Material e Equipamento
            </p>
        </div>
        <button onclick="openInventoryModal()"
            class="admin-only hidden bg-surface border border-slate-700 text-white px-6 py-2 font-body font-bold text-sm uppercase tracking-wider hover:border-primary hover:text-primary transition-all whitespace-nowrap">
            + Adicionar Material
        </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-surface border border-slate-800 p-6 flex flex-col justify-center items-center">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Total de Artigos</span>
            <span id="inv-total-items" class="font-display text-4xl text-white">0</span>
        </div>
        <div class="bg-surface border border-slate-800 p-6 flex flex-col justify-center items-center">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Valor Estimado</span>
            <span id="inv-total-value" class="font-display text-4xl text-primary">€ 0.00</span>
        </div>
        <div class="bg-surface border border-slate-800 p-6 flex flex-col justify-center items-center">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Avisos (Mau Estado)</span>
            <span id="inv-warnings" class="font-display text-4xl text-red-500">0</span>
        </div>
    </div>

    <div class="bg-surface border border-slate-800 overflow-hidden">
        <div class="bg-background-dark border-b border-slate-800 px-6 py-3 flex justify-between items-center">
            <h3 class="text-white font-display tracking-wider text-xl uppercase">Catálogo</h3>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead
                    class="bg-background-dark/50 border-b border-slate-800 text-slate-500 text-xs uppercase tracking-widest">
                    <tr>
                        <th class="py-4 px-6 font-bold">Artigo</th>
                        <th class="py-4 px-6 font-bold text-center">Quantidade</th>
                        <th class="py-4 px-6 font-bold text-center">Estado</th>
                        <th class="py-4 px-6 font-bold text-right">Valor Unit.</th>
                        <th class="py-4 px-6 font-bold text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="inventory-list" class="text-sm">
                </tbody>
            </table>
        </div>
    </div>
</div>
