<div id="view-treasury" class="app-view hidden">
    <header
        class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-800 pb-4 gap-4">
        <div>
            <h2 class="text-primary text-5xl font-display tracking-wider">TESOURARIA</h2>
            <p class="text-slate-400 font-body uppercase text-sm tracking-widest mt-1">Gestão de Fundos da Equipa</p>
        </div>
        <button onclick="openTxModal()"
            class="admin-only hidden bg-surface border border-slate-700 text-white px-6 py-2 font-body font-bold text-sm uppercase tracking-wider hover:border-primary hover:text-primary transition-all whitespace-nowrap">
            + Nova Transação
        </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-surface border border-slate-800 p-6 flex flex-col justify-center items-center">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Saldo Atual</span>
            <span id="treasury-balance" class="font-display text-4xl text-primary">€ 0.00</span>
        </div>
        <div class="bg-surface border border-slate-800 p-6 flex flex-col justify-center items-center">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Total Receitas</span>
            <span id="treasury-income" class="font-display text-4xl text-green-500">€ 0.00</span>
        </div>
        <div class="bg-surface border border-slate-800 p-6 flex flex-col justify-center items-center">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">Total Despesas</span>
            <span id="treasury-expense" class="font-display text-4xl text-red-500">€ 0.00</span>
        </div>
    </div>

    <div class="bg-surface border border-slate-800 overflow-hidden">
        <div class="bg-background-dark border-b border-slate-800 px-6 py-3 flex justify-between items-center">
            <h3 class="text-white font-display tracking-wider text-xl uppercase">Movimentos</h3>
        </div>
        <div id="transactions-list" class="flex flex-col">
        </div>
    </div>
</div>
