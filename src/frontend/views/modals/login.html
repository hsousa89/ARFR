<div id="modal-admin-login"
    class="hidden fixed inset-0 bg-background-dark/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-4">
    <div class="bg-surface border border-slate-700 w-full max-w-sm shadow-hard overflow-hidden">
        <header class="bg-background-dark border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <h3 class="text-white font-display tracking-wider text-xl uppercase">Acesso Reservado</h3>
            <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </header>

        <form onsubmit="handleAdminLogin(event)" class="p-6 flex flex-col gap-4">
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Código PIN</label>
                <input type="password" id="admin-pin" required autocomplete="off"
                    class="w-full bg-background-dark border border-slate-700 text-center text-white text-2xl tracking-[1em] px-4 py-3 focus:border-primary focus:outline-none transition-colors">
                <p id="admin-error"
                    class="text-red-500 text-xs font-bold uppercase tracking-wider mt-2 hidden text-center">PIN
                    Incorreto</p>
            </div>

            <button type="submit" id="btn-login"
                class="mt-4 w-full bg-primary text-background-dark px-6 py-3 font-bold text-sm uppercase tracking-wider hover:bg-white transition-colors">
                Desbloquear
            </button>
        </form>
    </div>
</div>
