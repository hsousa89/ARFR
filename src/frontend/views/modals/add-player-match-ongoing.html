<div id="modal-late-player" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-surface border border-slate-700 shadow-2xl rounded-md w-full max-w-md flex flex-col overflow-hidden">

        <div class="flex justify-between items-center bg-background-dark p-4 border-b border-slate-800">
            <h3 class="text-white font-display uppercase tracking-widest text-lg flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">person_add</span>
                Adicionar Jogador
            </h3>
            <button onclick="window.closeLatePlayerModal()" class="text-slate-500 hover:text-red-500 transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="p-4 flex flex-col gap-4">
            <input type="text" id="late-player-search" oninput="window.filterLatePlayers(this.value)"
                placeholder="Pesquisar por nome..."
                class="w-full bg-background-dark border border-slate-700 text-white px-4 py-2 rounded focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all"
                autocomplete="off">

            <div id="late-player-results" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
            </div>

            <div id="late-player-guest-prompt"
                class="hidden mt-2 border-t border-slate-800 pt-4 flex flex-col items-center gap-3">
                <p class="text-xs text-slate-400 text-center">Nenhum jogador registado encontrado com este nome.</p>
                <button onclick="window.createGuestLatePlayer()"
                    class="w-full bg-primary/20 text-primary border border-primary hover:bg-primary hover:text-background-dark transition-all py-2 rounded font-bold uppercase tracking-widest text-xs">
                    Adicionar como Convidado
                </button>
            </div>
        </div>
    </div>
</div>
