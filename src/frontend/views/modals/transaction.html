<div id="modal-transaction"
    class="hidden fixed inset-0 bg-background-dark/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-surface border border-slate-700 w-full max-w-md shadow-hard overflow-hidden">
        <header class="bg-background-dark border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <h3 id="modal-tx-title" class="text-white font-display tracking-wider text-xl uppercase">Nova Transação</h3>
            <button onclick="closeTxModal()" class="text-slate-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </header>

        <form id="form-transaction" onsubmit="handleSaveTx(event)" class="p-6 flex flex-col gap-4">
            <input type="hidden" id="tx-id" name="id">

            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Descrição</label>
                <input type="text" id="tx-description" required
                    class="w-full bg-background-dark border border-slate-700 text-white px-4 py-2 focus:border-primary focus:outline-none transition-colors">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Data</label>
                    <input type="date" id="tx-date" required
                        class="w-full bg-background-dark border border-slate-700 text-white px-4 py-2 focus:border-primary focus:outline-none transition-colors"
                        style="color-scheme: dark;">
                </div>
                <div>
                    <label class="block text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Valor
                        (€)</label>
                    <input type="number" id="tx-amount" step="0.01" min="0" required
                        class="w-full bg-background-dark border border-slate-700 text-white px-4 py-2 focus:border-primary focus:outline-none transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Tipo de
                    Movimento</label>
                <select id="tx-type" required
                    class="w-full bg-background-dark border border-slate-700 text-white px-4 py-2 focus:border-primary focus:outline-none transition-colors">
                    <option value="INCOME">Receita (Entrada)</option>
                    <option value="EXPENSE">Despesa (Saída)</option>
                    <option value="MATERIAL DONATION">Doação de Material</option>
                </select>
            </div>

            <div class="mt-6 flex justify-end gap-4">
                <button type="button" onclick="closeTxModal()"
                    class="px-6 py-2 text-slate-400 font-bold text-sm uppercase tracking-wider hover:text-white transition-colors">Cancelar</button>
                <button type="submit" id="btn-save-tx"
                    class="bg-primary text-background-dark px-6 py-2 font-bold text-sm uppercase tracking-wider hover:bg-white transition-colors flex items-center gap-2">
                    <span>Guardar</span>
                </button>
            </div>
        </form>
    </div>
</div>
